name: scan_live
on:
  schedule:
    - cron: "50 12 * * 1-5"
    - cron: "20 18 * * 1-5"
  workflow_dispatch:
concurrency:
  group: scan_live
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U alpaca-py yfinance requests pandas
      - run: python scan_live.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RUN_UNTIL: ${{ github.event.schedule == '50 12 * * 1-5' && '18:30' || '22:05' }}
      - name: save signals
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data || true
          git diff --cached --quiet || git commit -m "live signals"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 5; done
