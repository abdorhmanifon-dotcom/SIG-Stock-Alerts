name: summary
on:
  schedule:
    - cron: "20 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yfinance requests pandas
      - run: python summary.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: save results
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data || true
          git diff --cached --quiet || git commit -m "daily results"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 5; done
