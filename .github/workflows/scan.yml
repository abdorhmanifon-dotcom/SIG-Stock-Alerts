name: scanner

on:
  schedule:
    - cron: "2,32 7-22 * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas numpy matplotlib requests arabic-reshaper
      - run: python scanner.py
      - name: حفظ حالة التنبيهات المرسلة
        run: |
          if [ -f sent_state.json ]; then
            git config user.name "scanner-bot"
            git config user.email "scanner-bot@users.noreply.github.com"
            git add sent_state.json
            git commit -m "state" || echo "no changes"
            git push
          else
            echo "لا يوجد ملف حالة (السوق مغلق)"
          fi
